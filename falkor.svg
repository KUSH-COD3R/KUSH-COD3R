<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- tail -->
  <path d="M60 130 Q20 150 30 185 Q45 165 70 155 Z" fill="#e8e8e8" stroke="#9aa" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="150" cy="120" rx="75" ry="38" fill="#f5f5f5" stroke="#9aa" stroke-width="2"/>
  <!-- wings -->
  <path d="M130 95 Q120 30 200 20 Q180 70 175 100 Z" fill="#dfe9f5" stroke="#9aa" stroke-width="2"/>
  <!-- neck and head -->
  <path d="M205 110 Q230 70 235 45" stroke="#f5f5f5" stroke-width="26" fill="none" stroke-linecap="round"/>
  <ellipse cx="245" cy="42" rx="26" ry="18" fill="#f5f5f5" stroke="#9aa" stroke-width="2"/>
  <!-- feathered ears -->
  <path d="M232 30 Q215 5 225 -2 Q236 15 240 28 Z" fill="#ffd27f"/>
  <path d="M250 28 Q255 5 268 2 Q262 20 258 30 Z" fill="#ffd27f"/>
  <!-- eye and smile -->
  <circle cx="252" cy="38" r="4" fill="#222"/>
  <path d="M258 50 Q266 53 270 46" stroke="#555" stroke-width="2" fill="none"/>
  <!-- legs -->
  <rect x="110" y="145" width="12" height="30" rx="5" fill="#f5f5f5" stroke="#9aa" stroke-width="2"/>
  <rect x="170" y="145" width="12" height="30" rx="5" fill="#f5f5f5" stroke="#9aa" stroke-width="2"/>
</svg>
