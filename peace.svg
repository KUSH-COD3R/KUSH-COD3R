<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7cff00"/>
    </linearGradient>
  </defs>
  <!-- ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#p)" stroke-width="12"/>
  <!-- peace symbol: vertical stroke and two lower diagonals -->
  <line x1="100" y1="100" x2="100" y2="20" stroke="url(#p)" stroke-width="12" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="36" y2="158" stroke="url(#p)" stroke-width="12" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="164" y2="158" stroke="url(#p)" stroke-width="12" stroke-linecap="round"/>
</svg>
